[package]
name = "quirin-provider-onigmo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autobins = false
description = "Onigmo regex resource contracts and their checker plugin, a user crate on the quirin-provider-plugin SDK (card ONIGMO-PROVIDER-PLUGIN)"

[lib]
name = "quirin_provider_onigmo"

# The checker plugin bound to every contract of this crate
# (`quirin-plugin.json`); `providers/package.py checkers` installs it at
# `checkers/onigmo-check/`.
[[bin]]
name = "quirin-onigmo-check"
path = "src/bin/onigmo_check.rs"
test = false

[dependencies]
qcore-schemas.workspace = true
serde.workspace = true
serde_json.workspace = true
quirin-provider-plugin = { path = "../quirin-provider-plugin" }
