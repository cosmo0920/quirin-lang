[workspace]
members = ["qcore-provider-libevent", "qcore-provider-chunkio", "qcore-provider-cmetrics", "qcore-provider-ctraces", "qcore-provider-librdkafka", "conformance"]
resolver = "2"

[workspace.dependencies]
qcore-schemas = { path = "../crates/qcore-schemas", version = "13.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
debug = false
strip = "debuginfo"
