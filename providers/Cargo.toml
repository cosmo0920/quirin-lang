[workspace]
members = ["quirin-provider-libc", "quirin-provider-cfl", "quirin-provider-mpack", "quirin-provider-msgpack", "quirin-provider-fluent-bit", "quirin-provider-shared", "quirin-provider-plugin", "qcore-provider-libevent", "qcore-provider-chunkio", "qcore-provider-cmetrics", "qcore-provider-ctraces", "qcore-provider-librdkafka", "conformance"]
resolver = "2"

[workspace.dependencies]
qcore-schemas = { path = "../crates/qcore-schemas", version = "26.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quirin-provider-shared = { path = "quirin-provider-shared" }
quirin-provider-libc = { path = "quirin-provider-libc" }
quirin-provider-cfl = { path = "quirin-provider-cfl" }
quirin-provider-mpack = { path = "quirin-provider-mpack" }
quirin-provider-msgpack = { path = "quirin-provider-msgpack" }
quirin-provider-fluent-bit = { path = "quirin-provider-fluent-bit" }

# Card TEST-STORAGE-BUDGET: line tables only, as the root workspace's dev
# profile (card W44-TEST-SUITE-WALL-TIME), so panics and backtraces keep
# file:line while the provider tests' executables, each linking the analysis
# crates, lose their full DWARF. opt-level, debug-assertions and
# overflow-checks keep their dev defaults; release (the packages) is unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = false
strip = "debuginfo"
