[package]
name = "qcore-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "qcore_compiler"
path = "src/lib.rs"

[dependencies]
qcore-schemas = { path = "../crates/qcore-schemas", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
cc = "1.2.50"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
