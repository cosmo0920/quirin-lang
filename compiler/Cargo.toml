[package]
name = "qcore-compiler"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "qcore_compiler"
path = "src/lib.rs"

[dependencies]
qcore-verification = { path = "../crates/qcore-verification", version = "0.2.0" }
qcore-c-gateway = { path = "../crates/qcore-c-gateway", version = "0.1.0" }
qcore-contract = { path = "../crates/qcore-contract", version = "0.1.0" }
qcore-core = { path = "../crates/qcore-core", version = "0.1.0" }
qcore-frontend = { path = "../crates/qcore-frontend", version = "0.1.0" }
qcore-schemas = { path = "../crates/qcore-schemas", version = "8.0.0" }
qcore-verifier-host = { path = "../crates/qcore-verifier-host", version = "0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
qcore-audit = { path = "../crates/qcore-audit", version = "0.1.0" }
cc = "1.2.50"
