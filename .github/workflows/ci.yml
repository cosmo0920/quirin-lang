name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # Card TEST-STORAGE-BUDGET: a CI build is fresh, so incremental state is
    # disk nothing reads again; this equals the test configuration's
    # build.incremental=false, so steps with and without it share their units.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Cards C-GATEWAY-INDIRECT-CENSUS-2, BASE-TYPE-READER-CENSUS and
      # W43-INDIRECT-ACCESS-GENERAL. No workspace member enables the census
      # feature, so without this step its hooks in the gateway compile nowhere
      # and rot silently (INDIRECT-CENSUS-FEATURE-UNBUILT).
      # Card TEST-STORAGE-BUDGET. Every step below that builds root-workspace
      # tests or examples passes the test-build configuration of
      # scripts/test_link_config.py (docs/agents/validation.md "Test build
      # storage"): no incremental state, and on Linux the workspace libraries
      # as Rust dylibs that test executables, binaries and examples link
      # dynamically. A fresh `cargo test --workspace` then peaks near 4 GB of
      # disk instead of 87 GB. The local gates pass the same arguments.
      - name: Lint and test the gateway with the indirect-access census compiled in
        run: |
          cargo clippy -p qcore-c-gateway --features indirect-census --all-targets -- -D warnings
          mapfile -t test_config < <(python3 scripts/test_link_config.py)
          cargo test "${test_config[@]}" -p qcore-c-gateway --features indirect-census --lib

      - name: Test, including the pinned Libevent audit
        run: |
          mapfile -t test_config < <(python3 scripts/test_link_config.py)
          cargo test "${test_config[@]}" --workspace

      - name: Check the six reevaluation regressions and controls
        run: |
          mapfile -t test_config < <(python3 scripts/test_link_config.py)
          cargo run "${test_config[@]}" -p qcore-compiler --example reevaluation_probe

      - name: Check the reevaluation follow-up regressions and controls
        run: |
          mapfile -t test_config < <(python3 scripts/test_link_config.py)
          cargo run "${test_config[@]}" -p qcore-compiler --example reevaluation_followup

      # Card P03-F. `cargo test --workspace` already runs these; naming them
      # separately with --nocapture puts the executed refusal ground and the
      # measured quota counters in the CI log, where a silent regression to the
      # override path would otherwise be invisible.
      # Card CI-RUST-JOB-PEAK: `--workspace --test execution_quota` (the one
      # target of that name, in qcore-verifier-host) keeps the whole
      # workspace's feature selection, so this reuses the test step's build;
      # `-p qcore-verifier-host` rebuilt four crates with that crate's features.
      - name: Execute the confinement refusal grounds and the per-execution quota
        run: |
          mapfile -t test_config < <(python3 scripts/test_link_config.py)
          cargo test "${test_config[@]}" --workspace --test execution_quota -- \
            --nocapture --test-threads=1 2>&1 | tee quota.log
          grep -q 'P03F-GROUND4:' quota.log

      # Card P03-F, rider P09-lock. `providers/package.py build` runs cargo with
      # --locked --offline, so a providers/Cargo.lock left stale by a version
      # bump fails here. Nothing in CI built the packages before, which is how
      # that lockfile stayed broken from P09 until the wave-6 repair.
      # Card CI-RUST-JOB-PEAK: the probes package.py and contracts.py run in the
      # root workspace (four examples and `quirin-audit`) are built with the
      # test-build configuration and the workspace's features, so they reuse
      # the test step's units instead of rebuilding them statically; the
      # packages themselves are the same release build as before.
      # Card PACKAGE-BYTES-DEPEND-ON-CHECKOUT: `reproduce` is `build` followed by
      # a second build from a copy of the checkout at another path with another
      # CARGO_HOME; it fails unless every output file is byte-identical, and
      # removes the second tree (about 0.3 GB) before the step ends.
      - name: Build, reproduce and verify the five provider packages against the pinned lockfile
        run: |
          python3 providers/package.py reproduce --output "$RUNNER_TEMP/provider-packages"
          for package in qcore.chunkio qcore.cmetrics qcore.ctraces qcore.libevent qcore.librdkafka; do
            python3 providers/package.py verify "$RUNNER_TEMP/provider-packages/$package" > /dev/null
          done

      - name: Run the provider workspace tests
        run: cargo test --manifest-path providers/Cargo.toml --workspace

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proof sources
        uses: actions/checkout@v4

      - name: Build with the pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          auto-config: false
          build: true

      - name: Test bounded Lean audit orchestration
        run: python3 -m unittest scripts.tests.test_check_lean_audits

      - name: Check all theorem audits and the complete QCore axiom closure
        run: python3 scripts/check_lean_audits.py --skip-build

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc-core, msvc-clang-analysis]
    env:
      CC: cl
      # Card TEST-STORAGE-BUDGET: as in the Linux job, and equal to the
      # runner's build.incremental=false, so every step shares its units.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Preserve pinned source line endings
        run: git config --global core.autocrlf false

      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure MSVC and Windows SDK environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Lint Windows targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Card P03-F, refusal ground 1. P03's confinement suite is
      # `#![cfg(target_os = "linux")]`, so until now no job executed the
      # confining profile's non-Linux refusal — it was argued by construction.
      # This target has no Landlock, no user namespace and no cgroup v2, so the
      # refusal here is the real one.
      - name: Execute the non-Linux execution-profile refusals
        shell: pwsh
        run: |
          cargo test -p qcore-verifier-host --test execution_quota -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run the Windows threading examples
        if: matrix.toolchain == 'msvc-core'
        shell: pwsh
        run: |
          $env:QCORE_CLANG = Join-Path $env:RUNNER_TEMP 'missing-qcore-clang.exe'
          .\examples\threads\build-windows.ps1 -Run

      - name: Check core functionality using MSVC with Clang unavailable
        if: matrix.toolchain == 'msvc-core'
        shell: pwsh
        run: |
          # An authoritative missing override prevents discovery of runner LLVM.
          $env:QCORE_CLANG = Join-Path $env:RUNNER_TEMP 'missing-qcore-clang.exe'
          cargo test --test toolchain_compatibility --test module_modes --test quant_index_contracts --test qcore_contract_corpus --test source_tasks --test windows_threads --test checked_mutex_guards --test std_socket
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p qcorec --test cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Card W48-QRLIB-LINKAGE: every platform's symbol reader from bytes,
          # an MSVC static .lib and one ntdll.dll function through the SDK's
          # ntdll.lib, each linked through its generated .qrlib with cl.exe.
          cargo test -p qcore-c-gateway --lib linkage::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p qcore-compiler --test qrlib_linkage -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($filter in @('clang::tests::', 'frontend::tests::', 'driver::tests::', 'c_emit::tests::', 'native_concurrency::tests::')) {
            cargo test --workspace --lib $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test full suite with MSVC and explicit Clang installation
        if: matrix.toolchain == 'msvc-clang-analysis'
        shell: pwsh
        run: |
          # windows-2022 includes LLVM; use its full path, including spaces.
          $env:QCORE_CLANG = (Get-Item 'C:\Program Files\LLVM\bin\clang.exe' -ErrorAction Stop).FullName
          & $env:QCORE_CLANG --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($case in @('CT13', 'CT26')) {
            $source = Join-Path $env:RUNNER_TEMP "$case.c"
            $binary = Join-Path $env:RUNNER_TEMP "$case.exe"
            cargo run -p qcorec -- emit "compiler/tests/fixtures/ct/$case/case.qr" -o $source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:QCORE_CLANG -std=c11 -Wall -Wextra -Werror $source -o $binary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $binary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Card TEST-STORAGE-BUDGET: Windows links tests statically (a DLL of
          # the large crates would exceed the 65,535-export limit), so the
          # suite runs in batches of 32 target names, each built, run and
          # deleted before the next (`--batch-size`), one executable at a
          # time as `cargo test` runs them (`--jobs 1`); the test set and
          # its fail-closed verdicts are the runner's, docs/agents/validation.md.
          python scripts/run_test_binaries.py --jobs 1 --batch-size 32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -p qcore-compiler --example reevaluation_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -p qcore-compiler --example reevaluation_followup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Visual Studio discovery without Clang on PATH
        if: matrix.toolchain == 'msvc-clang-analysis'
        shell: pwsh
        run: |
          Remove-Item Env:QCORE_CLANG -ErrorAction SilentlyContinue
          Remove-Item Env:VSINSTALLDIR -ErrorAction SilentlyContinue
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'clang.exe'))
          }) -join ';'
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            throw 'Clang must be absent from PATH for this discovery test'
          }
          # The runner has Visual Studio's optional Clang component. These
          # exercise preprocessing and JSON AST extraction through vswhere.
          foreach ($filter in @('legacy_c::tests::', 'chunk_source::tests::')) {
            cargo test --workspace --lib $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Compile-database fixtures must use the discovered executable too.
          cargo test -p qcore-compiler --test cycle19_current_command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p qcore-audit --test second_source_set
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p qcore-c-gateway --test o04_constructor_caller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p qcore-verification --test counter_source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Card W48-QRLIB-MACOS (5m). The Mach-O linkage path on an Apple Silicon
  # runner: the readers from bytes plus the SDK's own `libm.tbd`, and the
  # native rows (libm through the SDK text stub, a Mach-O C archive, a Rust
  # `staticlib`) under the three builds, and the float card's native rows.
  macos:
    runs-on: macos-15
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Record the SDK and toolchain
        run: |
          xcrun --show-sdk-path
          xcrun --show-sdk-version
          clang --version
          ld -v

      - name: Read linkage artifacts, including the SDK stubs
        run: cargo test -p qcore-c-gateway --lib "linkage::"

      - name: Link FFI calls through generated manifests on macOS
        run: >-
          cargo test -p qcore-compiler --test qrlib_linkage --test ffi_struct_import
          --test float_ffi --test usable_records -- --nocapture

      - name: Run the IEEE 754 float rows natively on macOS
        run: >-
          cargo test -p qcore-compiler --test float_types --test float_extern
          --test float_tasks --test float_buffer_payloads --test float_ieee_vectors
