[workspace]
exclude = ["providers"]
members = [
    "crates/qcore-audit",
    "crates/quirin-source-analysis",
    "compiler",
    "crates/qcore-c-gateway",
    "crates/qcore-contract",
    "crates/qcore-core",
    "crates/gateway-rules/rule-37-result-constructors",
    "crates/gateway-rules/rule-33-removed-selection",
    "crates/gateway-rules/rule-34-element-destroyer",
    "crates/gateway-rules/rule-32a-caller-frame-hold",
    "crates/qcore-frontend",
    "crates/qcore-gateway-rule-api",
    "crates/qcore-schemas",
    "crates/qcore-verifier-host",
    "crates/qcore-verification",
    "crates/gateway-rules/rule-35-literal-decay",
    "crates/gateway-rules/rule-36-exact-formal-return",
    "crates/gateway-rules/rule-38-descriptor-cells",
    "crates/qcorec",
    "crates/quirin-audit-plugin",
    "crates/quirin-audit-plugin-libevent",
    "crates/quirin-audit-plugin-measure",
]
resolver = "2"

# Card W44-TEST-SUITE-WALL-TIME: line tables only, so panics and backtraces keep
# file:line while the dev/test build (which the standing gate cleans every time)
# halves its build time and shrinks target/ from 59G to 20G. opt-level,
# debug-assertions and overflow-checks keep their dev defaults, so no test
# observes a different program. For full debugger info locally, set
# CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

