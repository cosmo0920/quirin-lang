[package]
name = "qcorec"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Quirin command-line driver over the qcore-compiler library."

# The package keeps the `qcorec` name: the core component of the language stays
# seated as "qcore", and every `qcore_*` Rust namespace, emitted-C symbol and
# diagnostics code is unchanged. Only the installed command is branded.
[[bin]]
name = "quirin"
path = "src/main.rs"

[dependencies]
qcore-compiler = { path = "../../compiler", version = "0.4.0" }
qcore-contract = { path = "../qcore-contract", version = "0.1.0" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
cc = "1.2.50"
