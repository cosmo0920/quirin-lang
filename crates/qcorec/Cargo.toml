[package]
name = "qcorec"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "QCore-C command-line driver over the qcore-compiler library."

[[bin]]
name = "qcorec"
path = "src/main.rs"

[dependencies]
qcore-compiler = { path = "../../compiler", version = "0.1.0" }
serde_json = "1.0.151"
