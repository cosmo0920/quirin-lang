[package]
name = "quirin-audit-plugin-measure"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The `quirin-audit measure` subcommand plugin (card MEASURE-TOOL, pluggable-cards seam F): prepares measurement sides, runs the pinned and configured audit routes, compares them row by row through the composition interface and writes one native-comparison record; publishes and verifies baselines."

[lib]
name = "quirin_audit_plugin_measure"

# `quirin-audit measure …` runs this executable.
[[bin]]
name = "quirin-audit-measure"
path = "src/main.rs"

[dependencies]
quirin-audit-plugin = { path = "../quirin-audit-plugin", version = "0.1.0" }
# The composition interface (seam G, `qcore_schemas::composition`), the only
# crate a plugin reads components through, and SHA-256. No analysis crate.
qcore-schemas = { path = "../qcore-schemas", version = "26.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
# Reports nest deeper than serde_json's default limit allows.
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
