[package]
name = "qcore-c-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fail-closed existing-C analysis, validated custody inference and Clang transport."

[features]
# Card C-GATEWAY-INDIRECT-CENSUS-2. Off by default and never enabled by any
# workspace member: with it off, `indirect_census` and every call site of it in
# `legacy_c` are compiled out entirely. It adds no rule and moves no verdict;
# the card publishes the byte-identity measurement that says so.
indirect-census = []
# Card GATEWAY-ANALYSIS-PATH-OPTIMIZATION. Off by default and never enabled by
# any workspace member: with it off, the fallback tables' consultation census
# (`legacy_route_table::census`) and its call sites are compiled out entirely.
route-census = []
# Card JOINED-PROVENANCE-ROUND-BOUND. Off by default and never enabled by any
# workspace member: with it off, `provenance_rounds` and its one call site in
# `legacy_joined_provenance::fixed_point` are compiled out entirely. It adds no
# rule and moves no verdict; the card publishes the byte-identity measurement
# that says so.
provenance-rounds-census = []
# Card SCALAR-STATEMENT-FORMS (round 26 E). Off by default and never enabled
# by any workspace member: with it off, `scalar_form_census` and its call sites
# are compiled out entirely. Measurement only; it moves no verdict.
scalar-form-census = []

[dependencies]
qcore-contract = { path = "../qcore-contract", version = "0.1.0" }
# Card CG13-UNION-AND-BITFIELD-PLACES: the bit-field storage-unit decision is
# the core `disjoint_footprint` model's (L2 -> L1, no provider dependency).
qcore-core = { path = "../qcore-core", version = "0.1.0" }
# Card GATEWAY-RULE-API: the rule-package interface, the registry model and
# the run-time switches the generated tables read.
qcore-gateway-rule-api = { path = "../qcore-gateway-rule-api", version = "0.1.0" }
qcore-schemas = { path = "../qcore-schemas", version = "26.0.0" }
# Card RULE32A-PILOT: rule 32a's package (plan seam B), asked through the rule
# interface at the caller-frame token hold.
rule-32a-caller-frame-hold = { path = "../gateway-rules/rule-32a-caller-frame-hold", version = "0.1.0" }
# Card RULE33-PILOT: rule 33's package (plan seam B), asked through the rule
# interface at its caller expansion and its frame row.
rule-33-removed-selection = { path = "../gateway-rules/rule-33-removed-selection", version = "0.1.0" }
# Card RULE34-PILOT: rule 34's package (plan seam B), asked through the rule
# interface at the transfer position.
rule-34-element-destroyer = { path = "../gateway-rules/rule-34-element-destroyer", version = "0.1.0" }
# Card RULE35-PILOT: gateway rule 35 as a rule package, hosted through the
# rule API (`rule_hosts`).
rule-35-literal-decay = { path = "../gateway-rules/rule-35-literal-decay", version = "0.1.0" }
# Card RULE36-PILOT: the gateway hosts rule 36's package.
rule-36-exact-formal-return = { path = "../gateway-rules/rule-36-exact-formal-return", version = "0.1.0" }
# Card RULE37-PILOT: rule 37's package (plan seam B), asked through the rule
# interface at its two registered arms.
rule-37-result-constructors = { path = "../gateway-rules/rule-37-result-constructors", version = "0.1.0" }
# Card MK-EVENT-DESCRIPTOR-QUANT: rule 38's package (the descriptor-cell table).
rule-38-descriptor-cells = { path = "../gateway-rules/rule-38-descriptor-cells", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
# `unbounded_depth` (no added crate): the typed dispatch reader streams
# Clang's JSON AST, whose statement nesting exceeds the default limit.
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
