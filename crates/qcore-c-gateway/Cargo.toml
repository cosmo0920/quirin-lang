[package]
name = "qcore-c-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Fail-closed existing-C analysis, validated custody inference and Clang transport."

[features]
# Card C-GATEWAY-INDIRECT-CENSUS-2. Off by default and never enabled by any
# workspace member: with it off, `indirect_census` and every call site of it in
# `legacy_c` are compiled out entirely. It adds no rule and moves no verdict;
# the card publishes the byte-identity measurement that says so.
indirect-census = []
# Card GATEWAY-ANALYSIS-PATH-OPTIMIZATION. Off by default and never enabled by
# any workspace member: with it off, the fallback tables' consultation census
# (`legacy_route_table::census`) and its call sites are compiled out entirely.
route-census = []
# Card JOINED-PROVENANCE-ROUND-BOUND. Off by default and never enabled by any
# workspace member: with it off, `provenance_rounds` and its one call site in
# `legacy_joined_provenance::fixed_point` are compiled out entirely. It adds no
# rule and moves no verdict; the card publishes the byte-identity measurement
# that says so.
provenance-rounds-census = []

[dependencies]
qcore-contract = { path = "../qcore-contract", version = "0.1.0" }
# Card CG13-UNION-AND-BITFIELD-PLACES: the bit-field storage-unit decision is
# the core `disjoint_footprint` model's (L2 -> L1, no provider dependency).
qcore-core = { path = "../qcore-core", version = "0.1.0" }
qcore-schemas = { path = "../qcore-schemas", version = "20.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
# `unbounded_depth` (no added crate): the typed dispatch reader streams
# Clang's JSON AST, whose statement nesting exceeds the default limit.
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
