[package]
name = "rule-36-exact-formal-return"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "C gateway rule 36 as a rule package: a source-confirmed, unrebound original borrowed pointer formal returned bare (`return P;`) lowers, in the derived-result CFG only, to an exact non-owning alias of that formal (return route `exact-formal-return`), with its lexical candidate, source conjunction and exit flow classifier."

