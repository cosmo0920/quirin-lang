# --- Arms: rules that amend one predicate of a reader. They replace the
# --- per-card compile-time arm constants (`LITERAL_ARM`, `DECAY_ARM`,
# --- `CONST_VALUE_ARM`, `VOID_BIT_CAST_ARM`, `ELEMENT_ARM`), each of which
# --- covered its whole rule and whose `false` was the old refusal, so the
# --- switch is equivalent with nothing off and fail-closed when off. They
# --- postdate the route map's base or sit inside a reader, so they have no
# --- consultation order.

# Rule 35 is its own rule package (card RULE35-PILOT): an arm's route is
# `module::function` of the package's crate under crates/gateway-rules/, and
# the gateway hosts it through the rule API (`rule_hosts`).
[[rule]]
id = "35"
crate = "rule-35-literal-decay"
lean = ["QCore.LiteralDecayReadings"]
document = "docs/agents/rules/35.md"
off = "refuses"
placements = [
  { position = "classification", arm = "literal-read", route = "literal_read::decide" },
  { position = "typed-reader", arm = "array-member-decay", route = "array_member_decay::decide" },
]

[[rule]]
id = "10m"
crate = "qcore-c-gateway"
lean = ["QCore.TypedConstPointerValue"]
document = "docs/agents/rules/10m.md"
off = "refuses"
placements = [
  { position = "typed-reader", arm = "const-pointer-value", route = "typed_const_pointer_value::pointer_value" },
  { position = "typed-reader", arm = "void-bit-cast", route = "typed_const_pointer_value::pointer_source" },
]

[[rule]]
id = "14c"
crate = "qcore-c-gateway"
lean = ["QCore.ResidualAccessReadings"]
document = "docs/agents/rules/14c.md"
off = "refuses"
placements = [
  { position = "typed-reader", arm = "scalar-element-address", route = "scalar_element_address::shape_admitted" },
]

# Card RULE33-PILOT: rule 33's body lives in its own package (the frame
# bodies' word shapes, the caller expansion and the selection decisions); the
# host reads each frame against its contracts and type model. Two arms: the
# body rewrite of each CFG build, which expands a checked frame's own body and
# its decimal-constant caller statements into the constituent calls (no
# route-map position names CFG-build rewrites, ROUTE-MAP §1, so it sits at the
# statement rewrite, its effect), and the frame's own row under the selection
# entry, whose materialization is read at the frame's lookup call (the
# contracted arm, §2.2). Off expands nothing and installs no frame, which is
# the gateway before rule 33.
[[rule]]
id = "33"
crate = "rule-33-removed-selection"
lean = ["QCore.RemovedSelection", "QCore.RemovedSelectionSwitch"]
document = "docs/agents/rules/33.md"
off = "refuses"
placements = [
  { position = "statement-rewrite", arm = "removed-selection-expansion", route = "selection_route::expand" },
  { position = "classification", arm = "removed-selection-entry", route = "selection_route::row" },
]

# Card RULE36-PILOT: rule 36's body lives in its own package. Its one
# placement is the head of `return_statement` (route map §4 step 2, which
# predates the rule, so it has no consultation order): in the derived-result
# CFG only, a confirmed bare return of the original borrowed formal. The same
# switch gates the package's lexical candidate (the derived CFG pre-filter and
# the neutral summary's refinement) and its exit classifier, which off
# refuses; every part only removes admissions when off.
[[rule]]
id = "36"
crate = "rule-36-exact-formal-return"
lean = ["QCore.ExactFormalReturn", "QCore.ExactFormalReturnSwitch"]
document = "docs/agents/rules/36.md"
off = "refuses"
placements = [
  { position = "return-route", arm = "exact-formal-return", route = "route::decide" },
]

# Card RULE37-PILOT: rule 37's body lives in its own package. Its two arms
# amend the aggregate store scan's mention reading (the typed sizeof
# exemption) and the checked-specification settlement (a specification naming
# its `asserted_allocation` premise stands only while rule 37 admits it, with
# the premise as an obligation). The null readers' checked-result guard is
# rule 37's too but is a restriction, so it stays in the host and has no arm.
[[rule]]
id = "37"
crate = "rule-37-result-constructors"
lean = ["QCore.ResultConstructors", "QCore.ResultConstructorSwitch"]
document = "docs/agents/rules/37.md"
off = "refuses"
placements = [
  { position = "typed-reader", arm = "sizeof-operand-exemption", route = "sizeof_operand::decide" },
  { position = "classification", arm = "asserted-allocation-premise", route = "asserted_allocation::decide" },
]

# Card MK-EVENT-DESCRIPTOR-QUANT: rule 38's cell table lives in its own
# package; the host (`legacy_descriptor_cells.rs`) asks it from rule 12t's
# retaining call (the classifier's uncontracted fallback) and its transfer.
# Two arms: a declared release through a cell, and the member-equality guard.
# Card MK-EVENT-FIRST-MEMBER-CELL adds a third: the view of a member cell's
# actual (direct, or a record pointer read as its first member, C11
# 6.7.2.1p15). Card CELL-PROTOCOL-CLOSE-ACTUAL (rule 38d) adds a fourth: the
# access gate's admission of a declared cell's `close` actual for rule 38c's
# close. Card CELL-PROTOCOL-PER-END-GUARDS (rule 38f) adds no arm: its
# per-end facts, the `> 0` dead edge and the holder's release are the protocol
# model's (`protocol::Fact`), whose Lean module is listed here.
# Off, the host refuses every call of a declaration carrying a cell state (the
# reading is not asked), which only removes admissions.
[[rule]]
id = "38"
crate = "rule-38-descriptor-cells"
lean = ["QCore.DescriptorCells", "QCore.CellProtocolCloseActual", "QCore.ResultSet", "QCore.CellProtocolPerEnd", "QCore.CellResultSet", "QCore.CellProtocolReleaseWindowFrames"]
document = "docs/agents/rules/38.md"
off = "refuses"
placements = [
  { position = "classification", arm = "descriptor-cell-release", route = "cells::release" },
  { position = "classification", arm = "descriptor-cell-guard", route = "cells::decide_equality" },
  { position = "classification", arm = "descriptor-cell-initial-member", route = "initial_member::member_view" },
  { position = "classification", arm = "descriptor-cell-close-actual", route = "close_actual::admits" },
]

# --- The transfer (ROUTE-MAP section 10, added by card RULE34-PILOT): arms
# --- that order one admitted contract call's declared container effects
# --- around its own reading. Off, the arm is not asked; the host's guard then
# --- refuses a call with an unlink of a released parameter (it is the end of
# --- the table, not a package, so it has no switch).

[[rule]]
id = "34"
crate = "rule-34-element-destroyer"
lean = ["QCore.ElementDestroyer", "QCore.ElementDestroyerSwitch"]
document = "docs/agents/rules/34.md"
off = "refuses"
placements = [
  { position = "transfer", arm = "destroyer-order", route = "destroyer_order::order" },
]

# --- Token holds (ROUTE-MAP section 1): a hold's admission is the refusal of
# --- a reading, so a switch that removed it would widen. Every hold is
# --- off = "not-switchable": QCORE_GATEWAY_RULES_OFF naming it is refused, and
# --- its host asks it under every switch list (card RULE32A-PILOT; the
# --- decision is the pluggable-cards plan's section 6 item 10).

# Card RULE32A-PILOT: rule 32a's decision lives in its own package. Its one
# placement is the caller-frame hold of the three token pipelines
# (`legacy_caller_frame_hold`, beside the review and pin holds): inside a
# frame member's own body, a call to a member of the same frame whose
# declaration is in force is held, refused `Unknown` under the reason key the
# row reserves.
[[rule]]
id = "32a"
crate = "rule-32a-caller-frame-hold"
lean = ["QCore.RkLogCallerFrame", "QCore.CallerFrameHoldSwitch"]
document = "docs/agents/rules/32a.md"
off = "not-switchable"
reason_keys = [
  { key = "caller-frame-self-reliance", category = "incomplete-obligation-coverage" },
]
placements = [
  { position = "token-hold", arm = "caller-frame-hold", route = "hold::decide" },
]
