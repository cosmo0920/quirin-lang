# The C gateway rule registry (plan docs/plans/pluggable-cards/README.md,
# seam B; card GATEWAY-RULE-API).
#
# One [[rule]] per rule package: its id (the rule id, or the card name where
# the code names no rule), the crate holding its body, its placements at the
# positions of the frozen route map (ROUTE-MAP.md below) with their
# consultation order (or the host predicate an arm amends), its Lean modules,
# its rule document, the reason keys it reserves, and what
# QCORE_GATEWAY_RULES_OFF does to it ("refuses": listed, it is not asked and
# falls through; "not-switchable": a hold, whose refusal would widen).
#
# This file is the source. Run `python3 scripts/gen_gateway_registry.py` after
# editing it; it writes crates/qcore-c-gateway/src/gateway_rule_registry.rs and
# the generated tables of crates/qcore-c-gateway/src/legacy_route_table.rs, and
# the Python suite fails when either differs from what it generates. Every
# ordered placement must equal the frozen route map's row (same rule, same
# route, same order); moving a row is a semantic change with its own identity
# run, never an edit here alone.
#
# The registry started by describing the routes as they were, every body in
# qcore-c-gateway. Each rule's migration to crates/gateway-rules/rule-<id>-<name>
# (32a, 33, 34, 35, 36, 37 first) is its own card; a migrated rule's `crate`
# names its package (rule 35: card RULE35-PILOT), which the generator requires
# to exist with every arm route a `pub fn` of the package.

schema = "qcore-gateway-rules/1"
route_map = "docs/reports/gateway-analysis-path-optimization/ROUTE-MAP.md"

# --- Statement fallbacks (ROUTE-MAP §2.1 rows 7-21) and return fallbacks
# --- (§4 step 3), in the order of their first placement.

[[rule]]
id = "W43-INDEX-TRAVERSAL"
crate = "qcore-c-gateway"
lean = ["QCore.IndexTraversal"]
document = "docs/reports/w43-index-traversal/README.md"
off = "refuses"
placements = [
  { position = "statement-fallback", order = 1, route = "stepped_access", clears_origins = false },
]

