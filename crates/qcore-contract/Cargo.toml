[package]
name = "qcore-contract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Declarative .qcore contract loading and observation interpretation over the published schema surface."

[dependencies]
qcore-core = { path = "../qcore-core", version = "0.1.0" }
qcore-frontend = { path = "../qcore-frontend", version = "0.1.0" }
qcore-schemas = { path = "../qcore-schemas", version = "25.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
