[package]
name = "qcore-audit"
version = "0.1.0"
edition = "2024"
default-run = "quirin-audit"
license = "MIT OR Apache-2.0"
description = "Configured existing-C resource projection and reproducible audit reports."

# Package and library names are unchanged (`qcore-audit` / `qcore_audit`); only
# the installed command is branded. See `crates/qcorec/Cargo.toml`.
[[bin]]
name = "quirin-audit"
path = "src/main.rs"

[[bin]]
name = "quirin-dump-checkpoint"
path = "src/bin/quirin-dump-checkpoint.rs"

[features]
# Card DEEP-AST-TRANSPORTS-AND-WALL-TIME. Off by default and never enabled by
# any workspace member: with it off, `unit_timing` and its one call site in
# `pinned_route` are compiled out entirely. It records each pinned-route unit's
# analysis interval for the card's wall-time measurement and moves no output.
unit-timing = []

[dependencies]
quirin-source-analysis = { path = "../quirin-source-analysis", version = "0.1.0" }
qcore-c-gateway = { path = "../qcore-c-gateway", version = "0.1.0" }
qcore-contract = { path = "../qcore-contract", version = "0.1.0" }
qcore-schemas = { path = "../qcore-schemas", version = "26.0.0" }
qcore-verification = { path = "../qcore-verification", version = "0.4.0" }
qcore-verifier-host = { path = "../qcore-verifier-host", version = "0.4.0" }
# Card W45-AUDIT-SUBCOMMAND-PLUGINS: the external-subcommand protocol.
quirin-audit-plugin = { path = "../quirin-audit-plugin", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Card W45-AUDIT-CHECKPOINTS: the `.qo` checkpoint's binary encoding (postcard,
# a specified, stable serde wire format) and its two text decompositions
# (YAML through serde_norway, TOML through toml). See
# docs/development/audit-checkpoints.md.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde_norway = "0.9.42"
toml = "1.1.6"

# Card W45-AUDIT-SUBCOMMAND-PLUGINS: the process-group kill of an external
# subcommand (the version `qcore-verifier-host` already uses).
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
