[package]
name = "qcore-audit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Configured existing-C resource projection and reproducible audit reports."

# Package and library names are unchanged (`qcore-audit` / `qcore_audit`); only
# the installed command is branded. See `crates/qcorec/Cargo.toml`.
[[bin]]
name = "quirin-audit"
path = "src/main.rs"

[dependencies]
qcore-core = { path = "../qcore-core", version = "0.1.0" }
qcore-c-gateway = { path = "../qcore-c-gateway", version = "0.1.0" }
qcore-contract = { path = "../qcore-contract", version = "0.1.0" }
qcore-schemas = { path = "../qcore-schemas", version = "14.0.0" }
qcore-verification = { path = "../qcore-verification", version = "0.4.0" }
qcore-verifier-host = { path = "../qcore-verifier-host", version = "0.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
