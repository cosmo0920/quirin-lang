[package]
name = "quirin-source-analysis"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pinned C source-analysis adapters shared by the compiler and audit runner."

[dependencies]
qcore-c-gateway = { path = "../qcore-c-gateway", version = "0.1.0" }
qcore-contract = { path = "../qcore-contract", version = "0.1.0" }
qcore-core = { path = "../qcore-core", version = "0.1.0" }
qcore-frontend = { path = "../qcore-frontend", version = "0.1.0" }
qcore-schemas = { path = "../qcore-schemas", version = "26.0.0" }
qcore-verification = { path = "../qcore-verification", version = "0.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
